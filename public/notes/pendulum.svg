<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img">
<rect x="1" y="1" width="758" height="378" rx="14" fill="#060b12" stroke="rgba(150,179,212,0.18)" stroke-width="1"/>
<text x="96" y="42" fill="#e7f1fb" font-size="15" font-weight="500" text-anchor="start" font-family="'Microsoft YaHei','PingFang SC',sans-serif">单摆：受力分解</text><text x="96" y="62" fill="#7f95ab" font-size="11.5" font-weight="400" text-anchor="start" font-family="'Microsoft YaHei','PingFang SC',sans-serif">张力的力臂为零；只有重力的切向分量 −mg sin θ 产生回复力矩</text>
<line x1="380" y1="42" x2="380" y2="60" stroke="#c8d6e4" stroke-width="4"/>
<line x1="380" y1="60" x2="464.5" y2="241.3" stroke="#dbe6f2" stroke-width="3"/>
