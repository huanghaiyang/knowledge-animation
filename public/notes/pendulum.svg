<circle cx="464.5" cy="241.3" r="15" fill="rgba(116,240,194,0.18)" stroke="#74f0c2" stroke-width="2"/>
<line x1="464.5" y1="241.3" x2="464.5" y2="325.3" stroke="#ffc983" stroke-width="2.2" stroke-linecap="round"/><polygon points="464.5,333.3 467.9,325.3 461.2,325.3" fill="#ffc983"/>
