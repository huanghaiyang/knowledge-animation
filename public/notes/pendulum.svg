<text x="392" y="162" fill="#ffc983" font-size="15" font-weight="500" text-anchor="start" font-family="'Microsoft YaHei','PingFang SC',sans-serif">θ</text>
<text x="474.5" y="337.3" fill="#ffc983" font-size="13" font-weight="400" text-anchor="start" font-family="'Microsoft YaHei','PingFang SC',sans-serif">mg</text>
<text x="300" y="262" fill="#d5c8ff" font-size="13" font-weight="400" text-anchor="start" font-family="'Microsoft YaHei','PingFang SC',sans-serif">−mg sin θ</text>
<text x="452" y="182" fill="#8fe8ff" font-size="13" font-weight="400" text-anchor="start" font-family="'Microsoft YaHei','PingFang SC',sans-serif">mg cos θ</text>
<text x="424" y="142" fill="#c8d6e4" font-size="14" font-weight="400" text-anchor="start" font-family="'Microsoft YaHei','PingFang SC',sans-serif">L</text>
<text x="96" y="350" fill="#7f95ab" font-size="11.5" font-weight="400" text-anchor="start" font-family="'Microsoft YaHei','PingFang SC',sans-serif">精确方程 θ″ + (g/L) sin θ = 0；小角近似把 sin θ 换成 θ，才得到等时性。</text>
</svg>
